<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#251e20">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>以撒口袋图鉴</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="search.js" defer></script>
  <script src="catalog.js" defer></script>
  <script src="overview.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <span class="creator-watermark">Applespriter</span>
  <div class="app-shell">
    <header class="brand"><a href="#" class="brand-title" aria-label="返回图鉴首页"><span class="brand-mark" aria-hidden="true">✦</span><span>以撒口袋图鉴<small>THE POCKET OF ISAAC</small></span></a><span class="version">忏悔<span>+</span></span></header>
    <section id="mine-header" class="mine-header" hidden>
      <h1>我的</h1>
      <nav id="mine-tabs" class="mine-tabs" role="tablist" aria-label="我的内容"><button id="mine-tab-favorites" data-mine-view="favorites" type="button" role="tab" aria-controls="catalog" aria-selected="true">收藏</button><button id="mine-tab-recent" data-mine-view="recent" type="button" role="tab" aria-controls="catalog" aria-selected="false" tabindex="-1">最近</button><button id="mine-tab-settings" data-mine-view="settings" type="button" role="tab" aria-controls="settings" aria-selected="false" tabindex="-1">设置</button><button id="mine-tab-about" data-mine-view="about" type="button" role="tab" aria-controls="about" aria-selected="false" tabindex="-1">关于</button></nav>
    </section>
    <main id="catalog">
      <section class="intro"><div><p class="eyebrow">一本放进口袋的地下室手册</p><h1>下一件，会是什么？</h1><p class="muted">认识每一件宝物，让每一局多一点把握。</p></div><div class="hero-items" aria-hidden="true"><i class="sprite" style="background-image:url(assets/collectibles.png);background-position:-384px 0"></i><i class="sprite" style="background-image:url(assets/collectibles.png);background-position:-320px -160px"></i><i class="sprite" style="background-image:url(assets/collectibles.png);background-position:-128px 0"></i></div></section>
      <section class="search-panel" aria-label="搜索与分类">
        <div class="search-box"><span aria-hidden="true" class="search-symbol">⌕</span><input id="search" type="search" placeholder="搜索名称、编号或效果…" aria-label="搜索名称、编号或效果" autocomplete="off"><button id="clear-search" aria-label="清空搜索" hidden>×</button></div>
        <div id="categories" class="categories" aria-label="物品分类"></div>
      </section>
      <div class="list-heading"><div><h2 id="list-title">全部图鉴</h2><span id="result-count" role="status" aria-live="polite"></span></div><div class="filters"><select id="quality" aria-label="品质筛选"><option value="">全部品质</option><option value="4">品质 4</option><option value="3">品质 3</option><option value="2">品质 2</option><option value="1">品质 1</option><option value="0">品质 0</option></select><select id="sort" aria-label="排序"><option value="id">编号 ↑</option><option value="quality">品质 ↓</option><option value="name">名称</option></select></div></div>
      <div class="catalog-tools"><button id="overview-open" type="button">▦ 图标总览</button><span id="page-summary"></span></div>
      <p id="list-location" class="list-location" role="status" hidden></p>
      <div id="list" class="item-grid"></div>
      <nav id="page-nav" class="page-nav" aria-label="图鉴分页"><button id="prev-page" type="button">← 上一页</button><label>第 <input id="page-number" type="number" min="1" value="1" inputmode="numeric" aria-label="跳转到页码"> / <span id="page-count">1</span> 页</label><button id="next-page" type="button">下一页 →</button></nav>
      <p id="list-note" class="list-note">资料已装进口袋，离线也能查阅。</p>
    </main>
    <main id="achievements" class="achievements" hidden>
      <section class="achievement-intro"><p class="eyebrow">每一次解锁，都有迹可循</p><h1>成就图鉴</h1><p class="muted">查找达成条件和解锁奖励，点开关联道具继续探索。</p></section>
      <section class="search-panel achievement-search" aria-label="搜索成就"><div class="search-box"><span aria-hidden="true" class="search-symbol">⌕</span><input id="achievement-search" type="search" placeholder="名称、A 编号、条件或奖励…" aria-label="搜索成就名称、编号、条件或奖励" autocomplete="off"><button id="achievement-clear" aria-label="清空成就搜索" hidden>×</button></div></section>
      <div class="list-heading"><div><h2>全部成就</h2><span id="achievement-count" class="result-count" role="status" aria-live="polite"></span></div><span class="muted">按编号排列</span></div>
      <div id="achievement-list" class="achievement-grid"></div>
      <nav id="achievement-pages" class="page-nav" aria-label="成就分页"><button id="achievement-prev" type="button">← 上一页</button><label>第 <input id="achievement-page" type="number" min="1" value="1" inputmode="numeric" aria-label="跳转成就页码"> / <span id="achievement-page-count">1</span> 页</label><button id="achievement-next" type="button">下一页 →</button></nav>
      <p class="list-note">成就进度以游戏为准；这里提供离线达成条件与奖励查询。</p>
    </main>
    <main id="detail" class="detail" hidden></main>
    <main id="quiz" class="quiz" hidden></main>
    <main id="settings" class="settings" role="tabpanel" aria-labelledby="mine-tab-settings" hidden></main>
    <main id="about" class="about" hidden></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="主导航"><button data-view="catalog" class="active"><span aria-hidden="true">▦</span>图鉴</button><button data-view="achievements"><span aria-hidden="true">♜</span>成就</button><button data-view="quiz"><span aria-hidden="true">?</span>背词</button><button data-view="mine"><span aria-hidden="true">♙</span>我的</button></nav>
  </div>
  <dialog id="overview-dialog" class="overview-dialog" aria-label="图标总览"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>请启用 JavaScript 以使用离线图鉴。</noscript>
</body>
</html>
